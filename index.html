const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};const yen=n=>Number(n).toLocaleString('ja-JP');const stampDate=()=>new Date().toLocaleString('ja-JP');function notify(t){document.getElementById('toast').innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',2700)};function log(t){s.logs.unshift({time:stampDate(),text:t});s.logs=s.logs.slice(0,50)};function show(mode){document.getElementById('toMember').classList.toggle('active',mode==='member');document.getElementById('toAdmin').classList.toggle('active',mode==='admin');document.getElementById('phone').style.display=mode==='member'?'flex':'none';document.getElementById('admin').style.display=mode==='admin'?'block':'none';render()};function mtab(t){memberTab=t;subPage='';render()};function apage(t){adminTab=t;render()};function page(t){subPage=t;render()};function tabsHtml(items,selected,fn){return '<div class="tabs">'+items.map(x=>'<button class="'+(x===selected?'active':'')+'" onclick="'+fn+'(\''+x+'\')">'+esc(x)+'</button>').join('')+'</div>'};function smallLine(a,b){return '<div class="line"><div class="grow">'+a+'</div>'+b+'</div>'};function bread(){return subPage?'<div class="sect"><button class="textlink" onclick="page(\'\')">‹ '+esc(memberTab)+'へ戻る</button></div>':''};function render(){document.getElementById('ptitle').textContent=subPage||memberTab;document.getElementById('bottom').innerHTML=[['抽選','✹'],['キャッシュバック','▣'],['スタンプラリー','◉'],['称号','✧'],['お知らせ','♧'],['その他','•••']].map(([t,icon])=>'<button class="'+(memberTab===t?'sel':'')+'" onclick="mtab(\''+t+'\')"><span class="sym">'+icon+'</span>'+t+'</button>').join('');document.getElementById('mscreen').innerHTML=memberHtml();document.getElementById('side').innerHTML='<div class="side-title">管理コンソール<small>架空のデータを編集できます< function memberHtml(){if(subPage==='ポイント履歴')return bread()+s.pointHistory.map(x=>'<div class="sect flex"><div><div class="small">'+esc(x.date)+'</div>'+esc(x.title)+'</div><strong class="'+(x.value>=0?'plus':'minus')+'">'+(x.value>=0?'+':'')+x.value+'</strong></div>').join('');if(subPage==='当選履歴')return bread()+(s.lotteryHistory.length?s.lotteryHistory.map(x=>'<div class="sect">'+esc(x.date)+'　'+esc(x.title)+'<br><strong>'+esc(x.result)+'</strong></div>').join(''):'<div class="empty">抽選結果はまだありません</div>');if(subPage==='今月の当選確率')return bread()+'<section class="mission"><div class="pill">通常モード</div><h2>あなたの今月当選確率</h2><h1 style="text-align:center;font-size:58px">'+s.multiplier.toFixed(1)+'<span style="font-size:17px"> 倍</span></h1><div style="font-size:78px;text-align:center">✦</div><p style="text-align:center">MISSIONをクリアすると<br>今月の当選確率がUPします。</p><div class="status">マンスリーチャレンジの称号を獲得する<br><button class="btn" style="margin-top:12px" onclick="earnTitle()">チャレンジを達成（デモ）</button></div></section>';if(subPage==='プレゼントBOX')return bread()+tabsHtml(['未受け取り','受け取り済み'],cashTab===0?'未受け取り':'受け取り済み',"giftTab")+(s.presents.filter(p=>(cashTab===0?!p.received:p.received)).map((p,i)=>'<div class="sect"><b>'+esc(p.name)+'</b><p class="small">獲得日：'+esc(p.date)+'</p>'+(p.received?'<span class="tag">受け取り済み</span>':'<button class="btn" onclick="receive('+p.id+')">受け取る</button>')+'</div>').join('')||'<div class="empty">該当するプレゼントはありません</div>');if(subPage==='プロフィール編集')return bread()+'<div class="avatar"><h3>YOUR AVATAR</h3><h1 style="text-align:center">✦</h1></div><div class="sect"><label>NAME<input id="profileName" class="field" maxlength="30" value="'+esc(s.profile)+'"></label><div class="actions"><button class="btn" onclick="saveProfile()">保存</button></div></div>';if(subPage==='QRコード読み取り')return bread()+'<div class="sect"><h2>商品QR読み取り体験</h2><p class="caption">デモ用コードを入力するか、下のボタンでQR読み取りを模擬します。実カメラには接続しません。</p><input class="field" id="scanInput" placeholder="発行済みのコード"><div class="actions"><button class="btn" onclick="scanToken()">コードを使用</button><button class="btn dark" onclick="simulateScan()">商品Aを読み取る（デモ）</button></div><p class="small">使用済みのコードは再使用できません。</p></div>';if(subPage==='抽選詳細')return bread()+'<div class="sect"><h2>抽選キャンペーン</h2>'+s.campaigns.filter(c=>c.status==='公開').map(c=>'<div class="status"><h3>'+esc(c.title)+'</h3><p>景品：'+esc(c.prize)+'　残り'+c.stock+'個</p><p>消費ポイント：<strong>'+c.cost+'pt</strong></p><button class="btn" onclick="draw('+c.id+')" '+(s.points<c.cost||c.stock===0?'disabled':'')+'>'+c.cost+'ptで抽選する</button></div>').join('')+'</div>';if(subPage==='クーポン')return bread()+'<div class="sect"><h2>未使用クーポン '+s.coupons+'枚</h2><p class="caption">クーポンの設定は運営画面から行います。</p><button class="btn" onclick="applyCoupon()" '+(s.coupons<=0?'disabled':'')+'>対象商品を購入（デモ）</button></div>';if(subPage==='ポイント交換')return bread()+'<div class="sect"><h2>キャッシュポイント交換</h2><p>保有 '+s.cash+'円分</p><button class="btn" '+(s.cash<100?'disabled':'')+' onclick="redeemCash()">100円分と交換（デモ）</button><p class="caption">本番の外部ポイント・現金交換には接続していません。</p></div>';if(subPage==='スタンプ詳細')return bread()+'<div class="stampCard"><div class="hero"><strong>エナジードリンクA<br>スタンプラリー</strong><div class="orbs">'+Array.from({length:5},(_,i)=>'<span class="orb '+(i<s.stamp?'on':'')+'">'+(i<s.stamp?'✓':i+1)+'</span>').join('')+'</div><small>5個で特典引換券1枚GET</small></div><div class="foot">特典引換券 '+s.tickets+'枚</div></div><div class="sect"><button class="btn" onclick="scanStamp()">商品を購入してスタンプ獲得（デモ）</button><p class="caption">実システムでは1日1個まで／対象QRの検証が必要です。</p></div>';switch(memberTab){case '抽選':return '<div class="intro"><div class="eyebrow">✹ 保有抽選ポイント</div><div class="balance"><b>'+s.points+'</b> pt <button class="textlink link" onclick="page(\'ポイント履歴\')">ポイント内訳 ›</button></div><div class="small">最短ポイント有効期限： --</div><div class="links"><button class="textlink" onclick="page(\'ポイント履歴\')">ポイント履歴</button><button class="textlink" onclick="page(\'当選履歴\')">当選履歴</button></div></div><button class="mode" onclick="page(\'今月の当選確率\')"><strong>通常モード</strong>あなたの今月当選確率 <b>'+s.multiplier.toFixed(1)+'倍 ›</b></button><button class="banner" onclick="page(\'抽選詳細\')"><strong>限定ポイントキャンペーン</strong><span>保有ポイントで抽選に挑戦 ›</span></button><button class="banner red" onclick="page(\'抽選詳細\')"><strong>毎月チャレンジ抽選</strong><span>当選結果をその場で確認</span></button><div class="sect"><h3 class="h3">抽選キャンペーン一覧</h3>'+s.campaigns.filter(c=>c.status==='公開').map(c=>smallLine('<b>'+esc(c.title)+'</b><p class="small">'+c.cost+'pt / '+esc(c.prize)+'</p>','<button class="btn" onclick="draw('+c.id+')" '+(s.points<c.cost?'disabled':'')+'>抽選する</button>')).join('')+'<div class="actions"><button class="btn dark" onclick="page(\'QRコード読み取り\')">▦ QR読取デモ</button></div></div>';case 'キャッシュバック':return '<div class="intro"><div class="eyebrow">▣ 保有キャッシュポイント</div><div class="flex"><div class="balance"><b>'+s.cash+'</b> 円分</div><button class="btn" onclick="page(\'ポイント交換\')">ポイント交換 ›</button></div><div class="small">最短有効期限： --</div><div class="links"><button class="textlink" onclick="page(\'ポイント履歴\')">ポイント履歴</button><button class="textlink">有効期限</button><button class="textlink" onclick="page(\'クーポン\')">コレクション</button></div></div><div class="mission"><span class="pill">キャッシュポイントの貯め方</span><h3>対象商品を購入してお得に！</h3><p class="caption">配信されたクーポンを対象QRに適用します。</p></div><div class="sect"><h3>未使用クーポン <span class="small">合計：'+s.coupons+'枚</span></h3><button class="btn dark" onclick="page(\'クーポン\')">クーポンを見る ›</button></div>';case 'スタンプラリー':return '<button class="banner" onclick="page(\'スタンプ詳細\')"><strong>ENERGY STAMP RALLY</strong><span>特典引換券をGET！</span></button><div class="stampCard"><div class="hero" style="background:linear-gradient(120deg,#a41530,#e73444)"><strong>BLACK STAMP RALLY</strong><p>5スタンプ達成で特典引換券</p></div><div class="foot">特典引換券 0枚</div></div><div class="sect"><button class="btn" onclick="page(\'スタンプ詳細\')">スタンプ詳細を見る</button></div>';case '称号':return '<div class="mission"><div class="eyebrow">MONTHLY CHALLENGES</div><p class="small">全商品QRコードスキャン数　'+s.stamp+' / 2</p><div class="progress"><div style="width:'+Math.min(100,s.stamp/2*100)+'%"></div></div></div><div class="avatar"><div class="flex"><div><small>NAME</small><h2>'+esc(s.profile)+'</h2></div><div><small>LV</small><h1>'+s.level+'</h1></div></div><div class="progress"><div style="width:'+Math.round(s.exp/5300*100)+'%"></div></div><p>EXP '+yen(s.exp)+' / 5,300</p><div class="actions"><button class="btn dark" onclick="page(\'プレゼントBOX\')">プレゼントBOX</button><button class="btn dark" onclick="page(\'プロフィール編集\')">プロフィール</button></div></div><div class="sect"><h3>YOUR RECORDS</h3><div class="medals">'+Array.from({length:20},(_,i)=>'<div class="medal">'+(i<5?['✦','♛','◉','♜','✹'][i]:'🔒')+'</div>').join('')+'</div></div>';case 'お知らせ':return tabsHtml(['あなた宛','みんな宛'],noticeTab===0?'あなた宛':'みんな宛','notifTab')+(noticeTab===0?'<div class="empty">お知らせはありません</div>':s.notices.map(n=>'<div class="sect"><b>'+esc(n.title)+'</b><p class="small">'+esc(n.date)+'</p></div>').join('')||'<div class="empty">お知らせはありません</div>');case 'その他':return '<button class="banner blue"><strong>会員限定キャンペーン</strong><span>POINT & CHALLENGE</span></button>'+['ユーザー情報','ガイド','対象商品','キャッシュポイントについて','抽選ポイントについて','称号について','よくある質問','お問い合わせ','利用規約'].map(t=>smallLine(esc(t),'<span style="color:#9098a3">›</span>')).join('')+'<div class="sect"><button class="btn dark" onclick="resetDemo()">デモデータを初期化</button></div>';default:return ''}}
function draw(id){const c=s.campaigns.find(c=>c.id===id);if(!c||c.status!=='公開'||c.stock<=0||s.points<c.cost){notify('抽選条件を満たしていません');return} s.points-=c.cost;s.pointHistory.unshift({date:stampDate(),title:'抽選：'+c.title,value:-c.cost});const won=Math.random()*100<(c.chance||20)*s.multiplier;const result=won?'当選':'はずれ';if(won){c.stock-=1;s.presents.unshift({id:Date.now(),name:c.prize,date:stampDate(),received:false})}s.lotteryHistory.unshift({date:stampDate(),title:c.title,result});log('抽選 '+c.title+' / '+result);save();render();notify('抽選結果：'+result+'（模擬抽選）')};function giftTab(n){cashTab=n==='未受け取り'?0:1;render()};function notifTab(n){noticeTab=n==='あなた宛'?0:1;render()};function receive(id){const p=s.presents.find(p=>p.id===id);if(p)p.received=true;save();render();notify('プレゼントを受け取り済みにしました（デモ）')};function saveProfile(){s.profile=(document.getElementById('profileName').value.trim()||'DEMO PLAYER').slice(0,30);save();render();notify('プロフィールを保存')};function earnTitle(){s.multiplier=1.5;s.exp=Math.min(5300,s.exp+100);save();render();notify('ミッション達成！今月の当選倍率1.5倍')};function scanStamp(){s.stamp++;if(s.stamp>=5){s.stamp=0;s.tickets++}save();render();notify('スタンプを獲得（デモ）')};function simulateScan(){const p=s.products[0];s.points+=p.point;s.stamp=Math.min(4,s.stamp+1);s.pointHistory.unshift({date:stampDate(),title:p.name+' 購入',value:p.point});log('会員のデモ読取：'+p.name);save();render();notify(p.point+'ポイント獲得（デモ）')};function scanToken(){const val=document.getElementById('scanInput').value.trim();const token=s.qrCodes.find(q=>q.code===val);if(!token){notify('コードが見つかりません');return}if(token.used){notify('このQRコードは使用済みです');return}const p=s.products.find(x=>x.id===token.productId);if(!p){notify('対象商品がありません');return}token.used=true;s.points+=p.point;s.pointHistory.unshift({date:stampDate(),title:p.name+' QR利用',value:p.point});log('QR使用：'+p.name);save();render();notify(p.point+'ポイント付与しました')};function applyCoupon(){if(s.coupons<=0)return;s.coupons--;s.cash+=30;log('クーポン利用・キャッシュポイント付与');save();ren function ztabs(items,index,callback){return '<div class="z-tabs">'+items.map((name,i)=>'<button class="'+(i===index?'active':'')+'" onclick="'+callback+'('+i+')">'+esc(name)+'</button>').join('')+'</div>'}
function zRow(date,title,val,icon){return '<div class="z-list-row">'+(icon?'<span class="zwin" style="flex:0 0 31px">'+icon+'</span>':'')+'<div class="body"><div class="sub">'+esc(date)+'</div><div class="title">'+esc(title)+'</div></div><div class="amount '+(val>=0?'plus':'minus')+'">'+(val>=0?'+':'')+val+'</div></div>'}
function zlink(label,to){return '<button class="zlink" onclick="page(\''+to+'\')">'+esc(label)+'</button>'}
function zimg(n,fn,extra=''){return '<button class="zbanner" onclick="'+fn+'" aria-label="'+esc(n)+'"><img alt="'+esc(n)+'" src="'+A[n]+'"></button>'+extra}
function zheader(label){return '<div class="zlot-head zgradient"><div class="zlot-points"><span class="zwin">WIN</span> '+label+'</div>'+

function zHelpPoints(){return '<div class="zhelp-page">'+
'<h2>抽選ポイントとは</h2><div class="zhelp-icon"><span class="zwin" style="width:60px;height:60px;font-size:20px">WIN</span></div><p>Z-TANSANメンバーズアプリで貯めて使えるオリジナルのポイントです。ポイントを使用して限定の抽選に応募できます。<br>※対象ブランドによって取得できるポイント数は異なります。</p>'+
'<h2>抽選ポイントの有効期限</h2><p>抽選ポイントの有効期限は、最終利用日（抽選ポイントの獲得または使用）から1年後の同日までとなります。<br>有効期限内にポイントを獲得または使用すると、有効期限は延長されます。</p>'+
'<h2>抽選ポイントの貯め方</h2><p><b>1. QRコードをスキャン</b><br>対象商品のQRコードを読み取ってください。</p><p><b>2. ポイントGET</b><br>LINEからアプリが起動し、ポイントが獲得できます。</p>'+
'<h2>抽選ポイントの使い方</h2><p>1. 参加する抽選を選択<br>2. 抽選画面へ進む<br>3. ポイントを消費して抽選する<br>4. 当選結果を確認する</p></div>'}
function zHelpOdds(){return '<div class="zhelp-page">'+
'<h2>「当選確率」とは何ですか？</h2><p>抽選キャンペーンにおいて、応募者が当選する確率を示します。通常は「1倍」に設定されていますが所定の条件を満たすことにより、当選確率を「1.5倍」に引き上げることが可能です。</p>'+
'<h2>当選確率UPにはどんな効果がありますか？</h2><p>アプリのすべての抽選キャンペーンが当選しやすくなります。</p>'+

function zTitle(){return '<div class="ztitle-hero"><div class="ztitle-mission"><h4>MONTHLY CHALLENGES</h4><div class="zprog-line"><span>全NOPE製品QRコードスキャン数</span><b>0 / 2</b></div><div class="zthin-progress"><span style="width:0%"></span></div><div class="zprog-line"><span>全ZONe製品QRコードスキャン数</span><b>0 / 2</b></div><div class="zthin-progress"><span style="width:0%"></span></div></div><div class="ztitle-person"><div class="zbig-g"><i>G</i></div><div class="zname"><div class="label">NAME</div><div class="val">'+esc(s.profile)+'</div><div class="zthin-progress" style="margin:10px 0 2px"><span style="width:45%"></span></div><div class="exp">EXP '+yen(s.exp)+' / 5,300</div></div><div style="text-align:center;font-size:12px">LV <div class="zlevel">'+s.level+'</div></div></div><div class="z-person-actions"><button onclick="page(\'プレゼントBOX\')">▣ プレゼントBOX</button><button onclick="page(\'プロフィール編集\')">✎ プロフィール</button><button onclick="page(\'称号ヘルプ\')">ⓘ ヘルプ</button></div></div>'+zmedals()}
function zCash(){return '<div class="z-cash-head zgradient"><div class="zlot-points" style="font-size:17px">▣ 保有キャッシュポイント</div><div class="z-cash-actions"><div><b>'+s.cash+'</b><small>円分</small></div><button class="z-grad-btn" onclick="page(\'ポイント交換\')">ポイント交換 ❯</button></div><div class="zmuted">最短有効期限：--</div><div class="zlinks">'+zlink('ポイント履歴','キャッシュポイント履歴')+zlink('有効期限','キャッシュポイント有効期限')+zlink('コレクション','コレクション')+'<button class="zlink zhelp" onclick="page(\'キャッシュポイントについて\')">ⓘ</button></div></div>'+
(showCashTip?'<div class="z-callout"><button class="cross" onclick="hideCashTip()">×</button><span class="z-white-tag">キャッシュポイントの貯め方</span><h3>対象商品を飲んでキャッシュポイントが貯まるクーポンを使おう！</h3><p>対象商品についているQRコードをスキャンすると以下の未使用クーポンが適用され、ポイントを獲得できます。</p></div>':'')+
'<div style="margin:12px 17px 15px"><img style="width:100%;border-radius:5px" src="'+A.more_student+'"></div><div class="zsection"><h2>未使用クーポン <span style="float:right;font-size:15px;color:#a6a6a6">合計：'+s.coupons+'円分</span></h2><div class="zcenter">現在クーポンはありません</div><div style="text-align:center;margin:25px">'+zlink('クーポンの獲得方法','クーポンの獲得方法')+'</div></div>'}
function zStamp(){return ['stamp_hyper','stamp_black','stamp_zero'].map(n=>'<button class="zstamp-card" onclick="page(\'スタンプラリー詳細\')"><img src="'+A[n]+'" alt="スタンプラリー"><div class="footer">▣ 特典引換券 '+s.tickets+' 枚</div></button>').join('')+'<div style="height:85px;padding:10px 16px"><button class="zlink" onclick="page(\'スタンプラリー詳細\')">WHITE SODA スタンプラリー　›</button></div>'}
function zStampDetail(){return '<img class="zstamp-detail-img" src="'+A.stamp_detail+'" alt="スタンプカード"><div class="z-stamp-benefit"><h2>特典</h2><div class="ticket">▣ 特典引換券　'+s.tickets+' 枚　›</div><div class="zstamp-card" style="margin:0;width:100%;background:white"><img src="'+A.stamp_hyper+'"><div style="padding:17px;color:#181818">HYPER ZONe スタンプラリー特典一覧</div></div><button onclick="page(\'特典BOX\')">特典BOX　›</button></div><div class="z-terms"><p>■実施期間：2025年10月31日〜終了日未定</p><p>■スタンプ獲得に必要な対象商品：HYPER ZONe ENERGY 400ml</p><p>■特典獲得方法：商品に貼付されているQRコードを読み取って使用するとスタンプがたまります。5スタンプで特典引換券が1枚獲得できます。</p><p>※スタンプは1日1個まで。QR読取途中のキャンセルはスタンプ獲得になりません。</p><p>※特典の配布数・有効期限・交換条件はキャンペーンによって異なります。</p><button class="z-grad-btn" onclick="scanStamp()">スタンプ獲得を模擬（デモ）</button></div>'}
function zProfile(){return '<div class="zprofile"><div><div class="zbig-g"><i>G</i></div><div style="flex:1"><label>NAME</label><input id="profileName" maxlength="30" value="'+esc(s.profile)+'"></div></div></div><div class="zavatar-group"><span style="font-size:13px">YOUR AVATAR</span><h2>FORWARD</h2><div class="zavatar-choices">'+['G','◈','C','✧'].map((v,i)=>'<button class="'+(avatarChoice===i?'on':'')+'" onclick="chooseAvatar('+i+')">'+v+'</button>').join('')+'</div><h2>BACKGROUND</h2><div class="zavatar-choices">'+['◆','◆','◆','◆'].map((v,i)=>'<button onclick="chooseAvatar('+i+')" style="color:'+['#8244ee','#fa7bac','#87b8fd','#25c5de'][i]+'">'+v+'</button>').join('')+'</div></div><div class="z-save"><button class="z-grad-btn" onclick="saveProfile()">保存</button><p style="margin-top:32px">'+zlink('保存せずに戻る','称号画面')+'</p></div>'}
function zPresent(){const shown=s.presents.filter(p=>(offerTab===0?!p.received:p.received));return ztabs(['未受け取り','受け取り済み'],offerTab,'setOfferTab')+(shown.length?shown.map(p=>'<div class="z-list-row"><div class="body">'+esc(p.name)+'</div>'+(p.received?'受け取り済み':'<button class="z-grad-btn" onclick="receive('+p.id+')">受け取る</button>')+'</div>').join(''):'<div style="padding:30px 17px;font-size:14px;color:#d1e4e8">称号獲得の記念報酬が表示されます。</div><div class="z-empty" style="min-height:360px">未受け取りのプレゼントはありません</div>')}
function zMoreSub(title){return '<div class="zhelp-page"><h2>'+esc(title)+'</h2><p>この画面の公開スクリーンショットが未取得のため、再構築上の仮画面です。元アプリにある詳細な表示・操作は未確認です。</p></div>'}
function zMain(){if(subPage){if(['ポイント履歴','抽選ポイント履歴','ポイント内訳'].includes(subPage))return zHistory('ポイント履歴','抽選');if(['キャッシュポイント履歴','キャッシュポイント有効期限'].includes(subPage))return zHistory('ポイント履歴','キャッシュ');if(subPage==='当選履歴')return (s.lotteryHistory.length?s.lotteryHistory.map(x=>'<div class="z-list-row"><div class="body"><div class="title">'+esc(x.title)+'</div><div class="sub">当選日時 '+esc(x.date)+'</div></div><span style="font-size:14px">'+esc(x.result)+'　›</span></div>').join(''):'<div class="z-empty">当選履歴はありません</div>');if(subPage==='今月の当選確率')return zprob();if(subPage==='当選倍率について')return zHelpOdds();if(subPage==='抽選ポイントについて')return zHelpPoints();if(subPage==='プレゼントBOX'||subPage==='特典BOX')return zPresent();if(subPage==='プロフィール編集')return zProfile();if(subPage==='称号画面')return zTitle();if(subPage==='スタンプラリー詳細'||subPage==='スタンプ詳細')return zStampDetail();if(subPage==='クーポンの獲得方法')return '<div class="zhelp-page"><h2>クーポンの獲得方法</h2><p><b>みんなに配信</b><br>アプリに自動で表示します。不定期に配信予定です。</p><p><b>限定配信</b><br>SNSやキャンペーン、イベント会場限定でクーポンを配布します。</p></div>';if(subPage==='QRコード読み取り')return '<div class="zsection"><h2>QRコードをスキャン</h2><p>実機カメラ連携は未実装です。デモ用トークンで動作をお試しください。</p><input class="field" id="scanInput" placeholder="管理画面で発行したデモコード"><div class="actions"><button class="z-grad-btn" onclick="scanToken()">コードを使用</button><button class="btn dark" onclick="simulateScan()">デモスキャン</button></div></div>';if(subPage==='抽選詳細')return '<div class="zsection"><h2>抽選キャンペーン</h2>'+s.campaigns.filter(c=>c.status==='公開').map(c=>'<div class="status"><h3>'+esc(c.title)+'</h3><p>'+esc(c.prize)+'　必要 '+c.cost+'pt</p><button class="z-grad-btn" onclick="draw('+c.id+')" '+(s.points<c.cost?'disabled':'')+'>'+c.cost+'ptで抽選する</button></div>').join('')+'</div>';if(subPage==='ポイント交換')return '<div class="zsection"><h2>ポイント交換</h2><p>現在の残高：'+s.cash+'円分</p><button class="z-grad-btn" onclick="redeemCash()" '+(s.cash<100?'disabled':'')+'>100円分交換（デモ）</button><p style="color:#aab">実際の送金・外部サービスとの連携は行われません。</p></div>';return zMoreSub(subPage)}
switch(memberTab){case '抽選':return zheader('保有抽選ポイント')+zOdds()+zimg('lottery_points',"page('抽選詳細')")+zimg('lottery_arknights',"page('抽選詳細')",'<div class="zbanner-date">2026/10/06(火) ～ 2026/12/24(木)</div>')+zimg('lottery_locked',"page('抽選詳細')")+'<div style="height:20px"></div>';case 'キャッシュバック':return zCash();case 'スタンプラリー':return zStamp();case '称号':return zTitle();case 'お知らせ':return ztabs(['あなた宛','みんな宛'],noticeTab,'setNoticeTab')+(noticeTab===0?'<div class="z-empty">お知らせはありません</div>':s.notices.length?s.notices.map(n=>'<div class="z-list-row"><div class="body"><div class="title">'+esc(n.title)+'</div><div class="sub">'+esc(n.date)+'</div></div>›</div>').join(''):'<div class="z-empty">お知らせはありません</div>');case 'その他':return zMoreMenu();default:return ''}}
