name: Publish demo preview
on:
  push:
    branches: [main]
    paths:
      - 'ztansan-browser-preview/**'
      - '.github/workflows/ztansan-preview-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ztansan-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./ztansan-browser-preview
      - id: deployment
        uses: actions/deploy-pages@v4
