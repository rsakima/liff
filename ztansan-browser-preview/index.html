<header class="top"><div class="brand">POINT & CHALLENGE <small>独立開発・操作確認用デモ</small></div><div class="switch"><button id="toMember" class="active">📱 会員画面</button><button id="toAdmin">▦ 運営管理</button></div></header>
<div class="notice">非公式プレビュー ／ 架空の会員・商品・抽選結果を使用 ／ 本番環境とは未接続</div>
<div class="workspace"><div class="phone" id="phone"><div class="phone-head"><div><h2 id="ptitle">抽選</h2><p>POINT & CHALLENGE <span style="color:#19ba78">◆ DEMO</span></p></div></div><div class="phone-screen" id="mscreen"></div><nav class="phone-bottom" id="bottom"></nav></div><div class="admin" id="admin"><div class="admin-wrap"><div class="sidebar" id="side"></div><main class="panel" id="apanel"></main></div></div></div><div id="toast"></div>
<script>
const KEY='member_campaign_browser_demo_v3';const seed={points:2,cash:30,stamp:1,exp:2400,level:28,multiplier:1,profile:'DEMO PLAYER',products:[{id:1,name:'エナジードリンク A',point:1},{id:2,name:'エナジードリンク B',point:2}],campaigns:[{id:1,title:'限定グッズが当たる！',cost:1,prize:'限定グッズ',stock:30,status:'公開',chance:18},{id:2,title:'毎月チャレンジ抽選',cost:2,prize:'デジタル特典',stock:45,status:'公開',chance:24}],notices:[{date:'2026/11/08',title:'11月キャンペーン公開のお知らせ',scope:'みんな宛'}],coupons:0,tickets:0,lotteryHistory:[],pointHistory:[{date:'2026/11/08',title:'デモ初期ポイント',value:2}],presents:[],qrCodes:[],logs:[]};let s;try{s=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){s=structuredClone(seed)};let memberTab='抽選',subPage='',adminTab='ダッシュボード',cashTab=0,noticeTab=0,toastTimer;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};const yen=n=>Number(n).toLocaleString('ja-JP');const stampDate=()=>new Date().toLocaleString('ja-JP');function notify(t){document.getElementById('toast').innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',2700)};function log(t){s.logs.unshift({time:stampDate(),text:t});s.logs=s.logs.slice(0,50)};function show(mode){document.getElementById('toMember').classList.toggle('active',mode==='member');document.getElementById('toAdmin').classList.toggle('active',mode==='admin');document.getElementById('phone').style.display=mode==='member'?'flex':'none';document.getElementById('admin').style.display=mode==='admin'?'block':'none';render()};function mtab(t){memberTab=t;subPage='';render()};function apage(t){adminTab=t;render()};function page(t){subPage=t;render()};function tabsHtml(items,selected,fn){return '<div class="tabs">'+items.map(x=>'<button class="'+(x===selected?'active':'')+'" onclick="'+fn+'(\''+x+'\')">'+esc(x)+'</button>').join('')+'</div>'};function smallLine(a,b){return '<div class="line"><div class="grow">'+a+'</div>'+b+'</div>'};function bread(){return subPage?'<div class="sect"><button class="textlink" onclick="page(\'\')">‹ '+esc(memberTab)+'へ戻る</button></div>':''};function render(){document.getElementById('ptitle').textContent=subPage||memberTab;document.getElementById('bottom').innerHTML=[['抽選','✹'],['キャッシュバック','▣'],['スタンプラリー','◉'],['称号','✧'],['お知らせ','♧'],['その他','•••']].map(([t,icon])=>'<button class="'+(memberTab===t?'sel':'')+'" onclick="mtab(\''+t+'\')"><span class="sym">'+icon+'</span>'+t+'</button>').join('');document.getElementById('mscreen').innerHTML=memberHtml();document.getElementById('side').innerHTML='<div class="side-title">管理コンソール<small>架空のデータを編集できます</small></div>'+['ダッシュボード','商品マスター','QRコード発行','抽選キャンペーン','会員管理','ポイント台帳','スタンプ企画','クーポン','特典・受取','お知らせ配信','応募履歴','監査ログ'].map((t,i)=>'<button class="'+(adminTab===t?'on':'')+'" onclick="apage(\''+t+'\')">'+['▦','▤','▦','✹','♙','▣','◉','◈','🎁','♧','☷','☰'][i]+'　'+t+'</button>').join('');document.getElementById('apanel').innerHTML=adminHtml()}
function memberHtml(){if(subPage==='ポイント履歴')return bread()+s.pointHistory.map(x=>'<div class="sect flex"><div><div class="small">'+esc(x.date)+'</div>'+esc(x.title)+'</div><strong class="'+(x.value>=0?'plus':'minus')+'">'+(x.value>=0?'+':'')+x.value+'</strong></div>').join('');if(subPage==='当選履歴')return bread()+(s.lotteryHistory.length?s.lotteryHistory.map(x=>'<div class="sect">'+esc(x.date)+'　'+esc(x.title)+'<br><strong>'+esc(x.result)+'</strong></div>').join(''):'<div class="empty">抽選結果はまだありません</div>');if(subPage==='今月の当選確率')return bread()+'<section class="mission"><div class="pill">通常モード</div><h2>あなたの今月当選確率</h2><h1 style="text-align:center;font-size:58px">'+s.multiplier.toFixed(1)+'<span style="font-size:17px"> 倍</span></h1><div style="font-size:78px;text-align:center">✦</div><p style="text-align:center">MISSIONをクリアすると<br>今月の当選確率がUPします。</p><div class="status">マンスリーチャレンジの称号を獲得する<br><button class="btn" style="margin-top:12px" onclick="earnTitle()">チャレンジを達成（デモ）</button></div></section>';if(subPage==='プレゼントBOX')return bread()+tabsHtml(['未受け取り','受け取り済み'],cashTab===0?'未受け取り':'受け取り済み',"giftTab")+(s.presents.filter(p=>(cashTab===0?!p.received:p.received)).map((p,i)=>'<div class="sect"><b>'+esc(p.name)+'</b><p class="small">獲得日：'+esc(p.date)+'</p>'+(p.received?'<span class="tag">受け取り済み</span>':'<button class="btn" onclick="receive('+p.id+')">受け取る</button>')+'</div>').join('')||'<div class="empty">該当するプレゼントはありません</div>');if(subPage==='プロフィール編集')return bread()+'<div class="avatar"><h3>YOUR AVATAR</h3><h1 style="text-align:center">✦</h1></div><div class="sect"><label>NAME<input id="profileName" class="field" maxlength="30" value="'+esc(s.profile)+'"></label><div class="actions"><button class="btn" onclick="saveProfile()">保存</button></div></div>';if(subPage==='QRコード読み取り')return bread()+'<div class="sect"><h2>商品QR読み取り体験</h2><p class="caption">デモ用コードを入力するか、下のボタンでQR読み取りを模擬します。実カメラには接続しません。</p><input class="field" id="scanInput" placeholder="発行済みのコード"><div class="actions"><button class="btn" onclick="scanToken()">コードを使用</button><button class="btn dark" onclick="simulateScan()">商品Aを読み取る（デモ）</button></div><p class="small">使用済みのコードは再使用できません。</p></div>';if(subPage==='抽選詳細')return bread()+'<div class="sect"><h2>抽選キャンペーン</h2>'+s.campaigns.filter(c=>c.status==='公開').map(c=>'<div class="status"><h3>'+esc(c.title)+'</h3><p>景品：'+esc(c.prize)+'　残り'+c.stock+'個</p><p>消費ポイント：<strong>'+c.cost+'pt</strong></p><button class="btn" onclick="draw('+c.id+')" '+(s.points<c.cost||c.stock===0?'disabled':'')+'>'+c.cost+'ptで抽選する</button></div>').join('')+'</div>';if(subPage==='クーポン')return bread()+'<div class="sect"><h2>未使用クーポン '+s.coupons+'枚</h2><p class="caption">クーポンの設定は運営画面から行います。</p><button class="btn" onclick="applyCoupon()" '+(s.coupons<=0?'disabled':'')+'>対象商品を購入（デモ）</button></div>';if(subPage==='ポイント交換')return bread()+'<div class="sect"><h2>キャッシュポイント交換</h2><p>保有 '+s.cash+'円分</p><button class="btn" '+(s.cash<100?'disabled':'')+' onclick="redeemCash()">100円分と交換（デモ）</button><p class="caption">本番の外部ポイント・現金交換には接続していません。</p></div>';if(subPage==='スタンプ詳細')return bread()+'<div class="stampCard"><div class="hero"><strong>エナジードリンクA<br>スタンプラリー</strong><div class="orbs">'+Array.from({length:5},(_,i)=>'<span class="orb '+(i<s.stamp?'on':'')+'">'+(i<s.stamp?'✓':i+1)+'</span>').join('')+'</div><small>5個で特典引換券1枚GET</small></div><div class="foot">特典引換券 '+s.tickets+'枚</div></div><div class="sect"><button class="btn" onclick="scanStamp()">商品を購入してスタンプ獲得（デモ）</button><p class="caption">実システムでは1日1個まで／対象QRの検証が必要です。</p></div>';switch(memberTab){case '抽選':return '<div class="intro"><div class="eyebrow">✹ 保有抽選ポイント</div><div class="balance"><b>'+s.points+'</b> pt <button class="textlink link" onclick="page(\'ポイント履歴\')">ポイント内訳 ›</button></div><div class="small">最短ポイント有効期限： --</div><div class="links"><button class="textlink" onclick="page(\'ポイント履歴\')">ポイント履歴</button><button class="textlink" onclick="page(\'当選履歴\')">当選履歴</button></div></div><button class="mode" onclick="page(\'今月の当選確率\')"><strong>通常モード</strong>あなたの今月当選確率 <b>'+s.multiplier.toFixed(1)+'倍 ›</b></button><button class="banner" onclick="page(\'抽選詳細\')"><strong>限定ポイントキャンペーン</strong><span>保有ポイントで抽選に挑戦 ›</span></button><button class="banner red" onclick="page(\'抽選詳細\')"><strong>毎月チャレンジ抽選</strong><span>当選結果をその場で確認</span></button><div class="sect"><h3 class="h3">抽選キャンペーン一覧</h3>'+s.campaigns.filter(c=>c.status==='公開').map(c=>smallLine('<b>'+esc(c.title)+'</b><p class="small">'+c.cost+'pt / '+esc(c.prize)+'</p>','<button class="btn" onclick="draw('+c.id+')" '+(s.points<c.cost?'disabled':'')+'>抽選する</button>')).join('')+'<div class="actions"><button class="btn dark" onclick="page(\'QRコード読み取り\')">▦ QR読取デモ</button></div></div>';case 'キャッシュバック':return '<div class="intro"><div class="eyebrow">▣ 保有キャッシュポイント</div><div class="flex"><div class="balance"><b>'+s.cash+'</b> 円分</div><button class="btn" onclick="page(\'ポイント交換\')">ポイント交換 ›</button></div><div class="small">最短有効期限： --</div><div class="links"><button class="textlink" onclick="page(\'ポイント履歴\')">ポイント履歴</button><button class="textlink">有効期限</button><button class="textlink" onclick="page(\'クーポン\')">コレクション</button></div></div><div class="mission"><span class="pill">キャッシュポイントの貯め方</span><h3>対象商品を購入してお得に！</h3><p class="caption">配信されたクーポンを対象QRに適用します。</p></div><div class="sect"><h3>未使用クーポン <span class="small">合計：'+s.coupons+'枚</span></h3><button class="btn dark" onclick="page(\'クーポン\')">クーポンを見る ›</button></div>';case 'スタンプラリー':return '<button class="banner" onclick="page(\'スタンプ詳細\')"><strong>ENERGY STAMP RALLY</strong><span>特典引換券をGET！</span></button><div class="stampCard"><div class="hero" style="background:linear-gradient(120deg,#a41530,#e73444)"><strong>BLACK STAMP RALLY</strong><p>5スタンプ達成で特典引換券</p></div><div class="foot">特典引換券 0枚</div></div><div class="sect"><button class="btn" onclick="page(\'スタンプ詳細\')">スタンプ詳細を見る</button></div>';case '称号':return '<div class="mission"><div class="eyebrow">MONTHLY CHALLENGES</div><p class="small">全商品QRコードスキャン数　'+s.stamp+' / 2</p><div class="progress"><div style="width:'+Math.min(100,s.stamp/2*100)+'%"></div></div></div><div class="avatar"><div class="flex"><div><small>NAME</small><h2>'+esc(s.profile)+'</h2></div><div><small>LV</small><h1>'+s.level+'</h1></div></div><div class="progress"><div style="width:'+Math.round(s.exp/5300*100)+'%"></div></div><p>EXP '+yen(s.exp)+' / 5,300</p><div class="actions"><button class="btn dark" onclick="page(\'プレゼントBOX\')">プレゼントBOX</button><button class="btn dark" onclick="page(\'プロフィール編集\')">プロフィール</button></div></div><div class="sect"><h3>YOUR RECORDS</h3><div class="medals">'+Array.from({length:20},(_,i)=>'<div class="medal">'+(i<5?['✦','♛','◉','♜','✹'][i]:'🔒')+'</div>').join('')+'</div></div>';case 'お知らせ':return tabsHtml(['あなた宛','みんな宛'],noticeTab===0?'あなた宛':'みんな宛','notifTab')+(noticeTab===0?'<div class="empty">お知らせはありません</div>':s.notices.map(n=>'<div class="sect"><b>'+esc(n.title)+'</b><p class="small">'+esc(n.date)+'</p></div>').join('')||'<div class="empty">お知らせはありません</div>');case 'その他':return '<button class="banner blue"><strong>会員限定キャンペーン</strong><span>POINT & CHALLENGE</span></button>'+['ユーザー情報','ガイド','対象商品','キャッシュポイントについて','抽選ポイントについて','称号について','よくある質問','お問い合わせ','利用規約'].map(t=>smallLine(esc(t),'<span style="color:#9098a3">›</span>')).join('')+'<div class="sect"><button class="btn dark" onclick="resetDemo()">デモデータを初期化</button></div>';default:return ''}}
function draw(id){const c=s.campaigns.find(c=>c.id===id);if(!c||c.status!=='公開'||c.stock<=0||s.points<c.cost){notify('抽選条件を満たしていません');return} s.points-=c.cost;s.pointHistory.unshift({date:stampDate(),title:'抽選：'+c.title,value:-c.cost});const won=Math.random()*100<(c.chance||20)*s.multiplier;const result=won?'当選':'はずれ';if(won){c.stock-=1;s.presents.unshift({id:Date.now(),name:c.prize,date:stampDate(),received:false})}s.lotteryHistory.unshift({date:stampDate(),title:c.title,result});log('抽選 '+c.title+' / '+result);save();render();notify('抽選結果：'+result+'（模擬抽選）')};function giftTab(n){cashTab=n==='未受け取り'?0:1;render()};function notifTab(n){noticeTab=n==='あなた宛'?0:1;render()};function receive(id){const p=s.presents.find(p=>p.id===id);if(p)p.received=true;save();render();notify('プレゼントを受け取り済みにしました（デモ）')};function saveProfile(){s.profile=(document.getElementById('profileName').value.trim()||'DEMO PLAYER').slice(0,30);save();render();notify('プロフィールを保存')};function earnTitle(){s.multiplier=1.5;s.exp=Math.min(5300,s.exp+100);save();render();notify('ミッション達成！今月の当選倍率1.5倍')};function scanStamp(){s.stamp++;if(s.stamp>=5){s.stamp=0;s.tickets++}save();render();notify('スタンプを獲得（デモ）')};function simulateScan(){const p=s.products[0];s.points+=p.point;s.stamp=Math.min(4,s.stamp+1);s.pointHistory.unshift({date:stampDate(),title:p.name+' 購入',value:p.point});log('会員のデモ読取：'+p.name);save();render();notify(p.point+'ポイント獲得（デモ）')};function scanToken(){const val=document.getElementById('scanInput').value.trim();const token=s.qrCodes.find(q=>q.code===val);if(!token){notify('コードが見つかりません');return}if(token.used){notify('このQRコードは使用済みです');return}const p=s.products.find(x=>x.id===token.productId);if(!p){notify('対象商品がありません');return}token.used=true;s.points+=p.point;s.pointHistory.unshift({date:stampDate(),title:p.name+' QR利用',value:p.point});log('QR使用：'+p.name);save();render();notify(p.point+'ポイント付与しました')};function applyCoupon(){if(s.coupons<=0)return;s.coupons--;s.cash+=30;log('クーポン利用・キャッシュポイント付与');save();render();notify('キャッシュポイント +30円分')};function redeemCash(){if(s.cash<100)return;s.cash-=100;save();render();notify('デモ交換を実施（実際の送金なし）')};function resetDemo(){if(!confirm('デモデータを初期化しますか？'))return;s=structuredClone(seed);save();memberTab='抽選';subPage='';adminTab='ダッシュボード';render();notify('初期化しました')};
function adminHtml(){let h='<h1>'+esc(adminTab)+'</h1><p>管理画面プレビュー・デモデータのみ。内容はこのブラウザ内で反映されます。</p>';if(adminTab==='ダッシュボード')return h+'<div class="cards">'+[['登録商品',s.products.length+'件'],['公開中抽選',s.campaigns.filter(c=>c.status==='公開').length+'件'],['抽選応募',s.lotteryHistory.length+'件'],['会員数','1人（デモ）'],['保有抽選ポイント',s.points+'pt'],['未使用クーポン',s.coupons+'枚']].map(x=>'<div class="kpi"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="box"><h3>管理画面から操作してみましょう</h3><p class="small">「商品マスター」で商品を追加 →「QRコード発行」でコード生成 → 会員画面でコードを使用、という一連の処理を試せます。</p><div class="actions"><button class="btn" onclick="apage(\'商品マスター\')">商品を登録</button><button class="btn dark" onclick="apage(\'抽選キャンペーン\')">抽選を設定</button></div></div>'+recentLogs();if(adminTab==='商品マスター')return h+table(['ID','商品名','付与ポイント'],s.products.map(p=>[p.id,esc(p.name),p.point+'pt']))+'<div class="box"><h3>商品を登録</h3><div class="rowform"><label>商品名<input id="pname" class="field" placeholder="例：新商品C"></label><label>QR1回の付与ポイント<input id="ppoint" class="field" type="number" min="1" max="100" value="1"></label></div><div class="actions"><button class="btn" onclick="addProduct()">商品を追加</button></div></div>';if(adminTab==='QRコード発行')return h+'<div class="box"><h3>QRコードを発行（文字列トークン）</h3><div class="rowform"><label>対象商品<select id="qrproduct" class="field">'+s.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></label><label>発行数<input id="qrcount" class="field" type="number" min="1" max="10" value="1"></label></div><div class="actions"><button class="btn" onclick="issueQR()">コードを発行</button></div><p class="caption">このデモは印刷用のQR画像ではなく、コード文字列を発行します。</p><div id="qrresult" class="qrbox" style="display:none"></div></div>'+table(['コード','商品','使用状況'],s.qrCodes.slice().reverse().map(q=>[esc(q.code),esc(s.products.find(p=>p.id===q.productId)?.name||''),q.used?'使用済み':'未使用']));if(adminTab==='抽選キャンペーン')return h+table(['タイトル','景品','必要pt','在庫','公開'],s.campaigns.map(c=>[esc(c.title),esc(c.prize),c.cost,c.stock,'<button class="btn dark" onclick="toggleCampaign('+c.id+')">'+esc(c.status)+'</button>']))+'<div class="box"><h3>抽選キャンペーンを追加</h3><div class="rowform"><label>企画名<input id="ctitle" class="field" placeholder="例：新商品発売抽選"></label><label>景品名<input id="cprize" class="field" placeholder="例：限定グッズ"></label><label>消費pt<input id="ccost" type="number" min="1" class="field" value="1"></label><label>景品在庫<input id="cstock" type="number" min="1" class="field" value="10"></label><label>模擬当選率（%）<input id="cchance" type="number" min="0" max="100" class="field" value="20"></label></div><div class="actions"><button class="btn" onclick="addCampaign()">公開キャンペーンを追加</button></div></div>';if(adminTab==='会員管理')return h+table(['会員ID','表示名','抽選pt','キャッシュpt','会員LV'],[['demo-member',esc(s.profile),s.points,s.cash,s.level]])+'<div class="box"><h3>ポイント補正</h3><div class="rowform"><label>補正ポイント（負数可）<input id="adjust" class="field" type="number" value="10"></label><label>補正理由<input id="reason" class="field" value="デモ用のポイント補正"></label></div><div class="actions"><button class="btn" onclick="adjustPoints()">補正を反映</button></div></div>';if(adminTab==='ポイント台帳')return h+table(['日時','取引','増減'],s.pointHistory.map(p=>[esc(p.date),esc(p.title),'<span class="'+(p.value>=0?'plus':'minus')+'">'+(p.value>=0?'+':'')+p.value+'</span>']));if(adminTab==='スタンプ企画')return h+'<div class="cards"><div class="kpi"><small>獲得スタンプ</small><strong>'+s.stamp+' / 5</strong></div><div class="kpi"><small>特典引換券</small><strong>'+s.tickets+'枚</strong></div></div><div class="box"><h3>スタンプテスト</h3><p class="small">このブラウザデモでは日次上限・対象QRチェックは簡略化しています。</p><button class="btn" onclick="scanStamp()">スタンプを付与（テスト）</button></div>';if(adminTab==='クーポン')return h+'<div class="box"><h3>キャッシュクーポン配布</h3><p>会員 demo-member / 未使用 '+s.coupons+'枚</p><button class="btn" onclick="giveCoupon()">30円分クーポンを1枚配布</button></div>';if(adminTab==='特典・受取')return h+table(['景品名','当選日','受取状況'],s.presents.map(p=>[esc(p.name),esc(p.date),p.received?'受取済み':'未受取']))+'<div class="box"><h3>景品の受取管理</h3><p class="caption">会員画面の「称号 → プレゼントBOX」から受取操作を確認できます。</p></div>';if(adminTab==='お知らせ配信')return h+table(['日付','配信先','タイトル'],s.notices.map(n=>[esc(n.date),esc(n.scope),esc(n.title)]))+'<div class="box"><h3>新しいお知らせ</h3><label>タイトル<input id="ntitle" class="field" placeholder="例：新商品発売のお知らせ"></label><div class="actions"><button class="btn" onclick="sendNotice()">みんな宛に配信（デモ）</button></div></div>';if(adminTab==='応募履歴')return h+table(['日時','企画','結果'],s.lotteryHistory.map(r=>[esc(r.date),esc(r.title),esc(r.result)]));if(adminTab==='監査ログ')return h+recentLogs();return h};function recentLogs(){return '<div class="box"><h3>最近の操作履歴</h3>'+(s.logs.length?s.logs.slice(0,10).map(l=>'<div class="line"><span class="small">'+esc(l.time)+'</span><div>'+esc(l.text)+'</div></div>').join(''):'<div class="small">操作履歴はまだありません</div>')+'</div>'};function table(cols,rows){return '<div class="box tablewrap"><table class="t"><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+cols.length+'" style="color:#a2acba">データがありません</td></tr>')+'</tbody></table></div>'};function addProduct(){const name=document.getElementById('pname').value.trim(),v=Number(document.getElementById('ppoint').value);if(!name||!Number.isInteger(v)||v<1||v>100){notify('商品名と1〜100のポイントを入力してください');return}s.products.push({id:Math.max(0,...s.products.map(x=>x.id))+1,name,point:v});log('商品登録 '+name);save();render();notify('会員側に反映する商品を登録')};function issueQR(){const id=Number(document.getElementById('qrproduct').value),count=Number(document.getElementById('qrcount').value);if(!Number.isInteger(count)||count<1||count>10){notify('発行数は1〜10にしてください');return}const codes=Array.from({length:count},()=>{let code='DEMO-'+Array.from(crypto.getRandomValues(new Uint32Array(2))).map(n=>n.toString(36)).join('').slice(0,14).toUpperCase();s.qrCodes.push({code,productId:id,used:false});return code});log('QR発行 '+count+'件');save();render();const el=document.getElementById('qrresult');el.style.display='block';el.textContent=codes.join('\n');notify('デモ用コードを発行しました')};function toggleCampaign(id){const c=s.campaigns.find(x=>x.id===id);if(!c)return;c.status=c.status==='公開'?'停止':'公開';log('キャンペーンを'+c.status+'：'+c.title);save();render()};function addCampaign(){const title=document.getElementById('ctitle').value.trim(),prize=document.getElementById('cprize').value.trim(),cost=Number(document.getElementById('ccost').value),stock=Number(document.getElementById('cstock').value),chance=Number(document.getElementById('cchance').value);if(!title||!prize||![cost,stock,chance].every(Number.isFinite)||cost<1||stock<1||chance<0||chance>100){notify('入力内容を確認してください');return}s.campaigns.unshift({id:Math.max(0,...s.campaigns.map(x=>x.id))+1,title,prize,cost,stock,status:'公開',chance});log('キャンペーン公開 '+title);save();render();notify('公開キャンペーンを追加しました')};function adjustPoints(){const v=Number(document.getElementById('adjust').value),reason=document.getElementById('reason').value.trim();if(!Number.isInteger(v)||v===0||!reason||s.points+v<0){notify('補正値と理由を確認してください');return}s.points+=v;s.pointHistory.unshift({date:stampDate(),title:reason,value:v});log('ポイント補正 '+v);save();render();notify('会員ポイントを補正しました')};function giveCoupon(){s.coupons++;log('クーポンを1枚配布');save();render();notify('クーポンを配布しました')};function sendNotice(){const t=document.getElementById('ntitle').value.trim();if(!t){notify('タイトルを入力してください');return}s.notices.unshift({date:stampDate(),title:t,scope:'みんな宛'});log('お知らせ配信 '+t);save();render();notify('お知らせを配信しました')};document.getElementById('toMember').onclick=()=>show('member');document.getElementById('toAdmin').onclick=()=>show('admin');show('member');
</script></body></html>
